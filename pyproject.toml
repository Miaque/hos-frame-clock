[project]
name = "hos-frame-clock"
version = "0.3.0"
description = "Async PP-OCRv6 recognition of timestamps displayed in video frames"
readme = "README.md"
authors = [
    { name = "miaque", email = "miaque@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
